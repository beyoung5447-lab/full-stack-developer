<!DOCTYPE html>
<!-- html에서 사용하는 주석문: 해석 되지 않고 설명만 남는다.
** <!doctype html>: 문서 형식을 선언 하는 부분**
하단에 작성 되는 여러 가지 태그가 어떤 종류인지 정의 합니다.
문서가 어떤 속성을 가지는지 질의 하는 부분 입니다.
html5가 표준이 통합 되었습니다.
**html의 계층 구조**
html 태그 하위에 head/body/footer 태그가 위치 합니다.
head 태그는 meta, title등의 태그를 하위에 두고
body 태그는 앞으로 배울 다양한 기능의 태그들을 계층 구조로 가지고 있습니다.
html 태그의 구성
html 태그는 일반적으로 시작 태그와 종료 태그를 가집니다
물론 예외적으로 시작 태그만 있는 경우도 있습니다(예;'<br>')
html 태그의 기본 형태
'<태그명 속성 = "속성값">'
태그명과 함께 속성값을 가지며 내부에 특정 태그나 텍스트를 포함 합니다.
-->
<html lang="en"><!--최상위태그-->
<head><!--중간 계층 태그-->
    <meta charset="UTF-8"><!--charset라는 속성에 utf-8이라는 속성값을 가지고 있다.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹타이틀(상단)</title>
</head>
<body><!--중간 계층 태그: 주로 대부분의 태그를 선언하며 사용하는 곳-->
    <h2 align="center">웹프로그래밍의 구조</h2>
    <!--태그명 속성= 속성값으로 여러가지 화면 구성에 도움을 주는 처리를 한다.
    위의 경우 h2 태그의 내용을 화면 중앙에 보이게 처리한다
    02_structure.html 파일을 만들고 최상단에 웹프로그래밍시작이라고 표현하고
    
    h2 태그로 웹프로그래밍 세계에 오신것을 환영합니다.라고 표현 하며 웹서버를 통해
    출력 처리..-->

</body>
</html>
