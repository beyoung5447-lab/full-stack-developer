<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 페이지</title>
</head>
<body>
    <!-- 
      웹 폼 (Web Form)
      - 웹 페이지에서 사용자 입력을 받는 폼 (로그인, 회원가입, 검색, 예약 등)
      - <form name="폼이름" action="서버경로" method="get|post">
      
      * action: 폼 제출 시 데이터를 전달받아 처리할 서버측 스크립트 경로 (JSP, PHP, Python 등)
      * method:
        - GET: URL 뒤에 파라미터를 붙여서 전송 (예: login.do?userid=abc&userpw=123) - 검색 등에 사용
        - POST: HTTP 요청 본문(Body)에 담아서 전송 - 로그인, 회원가입 등 보안이 필요한 곳에 사용
    -->

    <h2>로그인 페이지(form 데이터 처리)</h2>
    <hr>

    <!-- 실무 로그인 기능에서는 보안을 위해 method="post"를 권장합니다 
     성적등복
     이름:{}
     국어점수:{}
    {등록}
    form을 만들어 그 안에 위와 같은 화면이 나올 수 있도록 구성-->
    <h3>로그인 페이지(form데이터 처리)</h3>
    <hr>
    <form name="fo" method="get">
        사용자 아이디:<input type="text" name="id" size="15" value=""><br>
        비밀번호:<input type="password" name="pwd" size="15" value=""><br>
        <input type="submit" value="로그인">
    </form>
    <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적등록</title>
</head>
<body>

    <h2>성적등록</h2>
    <hr>

    <!-- 성적 등록 폼 -->
    <form name="scoreForm" action="#" method="get">
        <label for="username">이름: </label>
        <input type="text" id="username" name="username" placeholder="이름 입력"><br><br>

        <label for="kor">국어점수: </label>
        <input type="number" id="kor" name="kor" min="0" max="100" placeholder="0~100 입력"><br><br>

        <!-- 등록 버튼 -->
        <input type="submit" value="등록">
    </form>

</body>
</html>
</body>
</html>
