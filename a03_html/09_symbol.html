<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    문자, 기호, 심볼 입력
    html5의 문자는 유니코드 문자셋을 사용하며 한글을 표현하기 위해 utf-8 코드 체계로 작성
    예약어 및 키보드로 직접 입력하기 어려운 기호들은 심볼 코드로 입력 합니다.
    예를 들어 공백 문자는 &nbsp;를 여러 번 입력하여 표현 하듯이 태그와 충돌하는 특수문자는
    심볼 코드는 사용해야 한다.
    <: 코드를 입력할때 태그와 충돌이 나므로 심볼 코드를 입력해야 한다.
    (&lt;- less than의 약어)
    >: (&gt; greater than의 약어)
    &: 앰퍼선드 기호 자체를 출력 하려면 &amp;를 입력 해야 한다.
    그 외 다양한 특수 문자나 수학 기호도 각각의 심볼 코드 체계에 맞춰 입력 해야 한다.
    참고할 심볼 기호 사이트: https://dev-handbook.tistory.com/23
    -->
    <h3>심볼기호</h3>
    <p>
        <hr>
        10 &divide; 2=5<br>
        &radic;2=1.414<br>
        2 &nbsp;&nbsp;&nbsp; &lt; &nbsp;&nbsp;&nbsp; 3<br>
        오늘 &quot;eliv&#34; 노래를 들었다
    </p>

    <!-- 사칙연산 기호 심볼 코드를 활용한 출력 -->
    <h3>사칙연산 결과</h3>
    <p>
        10 + 2 = 12<br>
        10 &minus; 2 = 8<br>
        10 &times; 2 = 20<br>
        10 &divide; 2 = 5
    </p>
</body>
</html>
