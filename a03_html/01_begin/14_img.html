    온라인상 좋아하는 인물 이미지를 다운로드 한 뒤 200/200으로 설정하여 화면에 출력

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 출력 연습</title>
</head>
<body>

    <!-- 1. 현재 폴더의 man.jpg 이미지 (크기: 가로 200, 세로 100) -->
    <h3>1. 로컬 이미지 (man.jpg)</h3>
    <img src="man.jpg" width="200" height="100" alt="남자 이미지">

    <!-- 2. 다운로드하여 같은 폴더에 저장한 인물 이미지 (크기: 가로 200, 세로 200) -->
    <!-- (다운로드받은 이미지 파일명을 person.jpg로 저장했다고 가정한 예시입니다) -->
    <h3>2. 다운로드한 인물 이미지</h3>
    <img src="person.jpg" width="200" height="200" alt="좋아하는 인물">

    <!-- 3. 온라인상 점심식사 이미지 링크 복사 (크기: 가로 100, 세로 100) -->
    <h3>3. 온라인 링크 점심식사 이미지</h3>
