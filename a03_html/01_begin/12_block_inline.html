<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!--
    블록 테그와 인라인 테그
    태그: 블록 태그와 인라인 테그로 구분
    블록 태그: p, hl,div,ul
    인라인 태그:strong, a, img, span
    블록 태그
    항상 새 라인에서 시작하여 출려
    양옆에 다른 콘텐츠를 배치 하지 않고 한 라인 독점 사용
    가장 많이 사용되는 블록 태그: div
    css에서 너비와 높이를 설정하여 사용 가능하다
    인라인 태그
    블록 속에 삽입되어 블록의 일부로 출력
    같은 유형의 태그는 줄바꿈 없이 옆으로 나열되어 출력
    가장 많이 사용되는 인라인 태그: span
    css에서 너비와 높이를 설정하여 사용 불가능하다.

    -->    
    <h2>블럭태그 선언(태그의 줄바꿈 포함)</h2>
    <h3>안녕1</h3>
    <h3>안녕2</h3>
    <h3>안녕3</h3>
    <h2>인라인 태그 선언(태그가 줄바꿈 포함되지 않음)</h2>
    <span>반갑습니다1.!</span>
    <span>반갑습니다2.!</span>
    <span>반갑습니다3.!</span>
    <!--블록테그(h3 또는 div등)을 사용하여 이름"개발자 김코딩"을 출력하세요
    인라인 태그등을 연속으로 사용하여 관심사 :"#html","#css","#java"등을 줄바꿈 없이 출력-->
    <h3>개발자 김코딩</h3>
<div>
  <span>관심사 : </span>
  <span>"#html"</span>, 
  <span>"#css"</span>, 
  <span>"#java"</span>
</div>
</body>
</html>
