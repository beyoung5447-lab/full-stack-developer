<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주소 출력 예시</title>
    <style>
        .address-box {
            font-family: monospace;
            white-space: pre;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- 1. pre 태그를 사용하여 띄어쓰기/들여쓰기를 그대로 유지하는 방법 -->
    <pre>
     서 울 특 별 시
     종 로 구
     세 종 로 1-1
    </pre>

    <hr>

    <!-- 2. div와 CSS(white-space: pre)를 활용하는 방법 -->
    <div class="address-box">
     서 울 특 별 시
     종 로 구
     세 종 로 1-1
    </div>

</body>
</html>
