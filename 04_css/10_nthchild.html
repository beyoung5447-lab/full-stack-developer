<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nth-child 활용</title>
    <style>
        /* 1. 3번째 h3 요소: 배경색 파란색, 글자색 흰색 */
        h3:nth-child(3) {
            background-color: blue;
            color: white;
        }

        /* 2. 홀수번째(1, 3, 5...) h3 요소: 글자색 연두색 */
        h3:nth-child(2n+1) {
            color: yellowgreen;
        } /* <- 이 닫는 중괄호가 누락되어 있었습니다 */

        /* 3. 짝수번째(2, 4...) h3 요소: 빨간색 테두리 */
        h3:nth-child(even) {
            border: 1px solid red;   
        }
    </style>
</head>
<body>

    <h3>안녕하세요 (1번째)</h3>
    <h3>안녕하세요 (2번째)</h3>
    <h3>안녕하세요 (3번째)</h3>
    <h3>안녕하세요 (4번째)</h3>
    <h3>안녕하세요 (5번째)</h3>
    /*table을 만들고 tr 단위로 짝수 번째 배경색상으로 노랑색
    3개마다 글자 색상을 blue로 처리 하세요*/
    <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    /* 짝수 번째 행(tr)의 배경색을 노란색으로 지정 */
    tr:nth-child(even) {
      background-color: yellow;
    }

    /* 3번째 행(tr)마다 글자 색상을 파란색으로 지정 */
    tr:nth-child(3n) {
      color: blue;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>번호</th>
        <th>내용</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>첫 번째 행</td></tr>
      <tr><td>2</td><td>두 번째 행 (짝수: 노랑)</td></tr>
      <tr><td>3</td><td>세 번째 행 (3의 배수: 파랑)</td></tr>
      <tr><td>4</td><td>네 번째 행 (짝수: 노랑)</td></tr>
      <tr><td>5</td><td>다섯 번째 행</td></tr>
      <tr><td>6</td><td>여섯 번째 행 (짝수 & 3의 배수: 노랑 + 파랑)</td></tr>
      <tr><td>7</td><td>일곱 번째 행</td></tr>
      <tr><td>8</td><td>여덟 번째 행 (짝수: 노랑)</td></tr>
      <tr><td>9</td><td>아홉 번째 행 (3의 배수: 파랑)</td></tr>
    </tbody>
  </table>

</body>
</html>
    

</body>
</html>
