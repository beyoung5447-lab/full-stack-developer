<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - focus 효과</title>
    <style>
    /* input 요소에 포커스(마우스 클릭 또는 Tab 입력)가 되었을 때 스타일 적용 */
    input:focus {
        background-color: yellow;
    }
    /*
    점수 입력할 수 있는 내용으로 국어/영어/수학등 입력할 수 있을때
    해당 내용을 포커싱 했을때 배경 색상과 글자 색상을 변경 해서 출력 되게 하세요.
    
    
    
    */
    </style>
</head>
<body>

    <h2>로그인</h2>
    <form>
        아이디: <input type="text"><br>
        패스워드: <input type="password"><br><br>
        <input type="submit" value="로그인">
    </form>
<style>
    /* input 요소에 포커스가 맞춰지면 배경색과 글자색 변경 */
    input:focus {
        background-color: #2196F3; /* 배경색: 파란색 계열 */
        color: white;               /* 글자색: 흰색 */
        outline: none;             /* 포커스 시 기본 테두리 깔끔하게 정리 */
        border: 2px solid #0D47A1;  /* 테두리 색상 강화 */
    }

    /* 입력창 기본 스타일 (선택 사항) */
    input {
        padding: 6px 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        transition: all 0.2s ease; /* 색상 전환을 부드럽게 표현 */
    }
    </style>
</head>
<body>

    <h2>성적 입력</h2>
    <form>
        <label>국어: <input type="number" min="0" max="100" placeholder="점수 입력"></label><br>
        <label>영어: <input type="number" min="0" max="100" placeholder="점수 입력"></label><br>
        <label>수학: <input type="number" min="0" max="100" placeholder="점수 입력"></label><br><br>
        <input type="submit" value="저장">
    </form>

</body>
</html>
