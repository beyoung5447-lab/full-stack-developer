<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 공부하기</title>
    <style>
        /* css의 주석
           style 영역은 한페이지에 적용할 내용입니다. */
        
        body { 
            background: red; 
        } 
        
        hr { 
            border: 5px solid yellowgreen; 
        } 
        
        span { 
            color: yellow; 
            font-size: 40px; 
        }
    </style>
</head>
<body>
    <h3>오늘도 프로그래밍!! 열심히!! 즐겁게!!</h3>
    <hr>
    <p>
        오늘은 <span>html</span>과 <span>css</span>를 공부하였습니다!!
    </p>

    <!--
    CSS (Cascading Style Sheet)
    HTML 문서의 색상이나 모양 등 겉모습을 아름답게 꾸며주는 디자인 언어입니다. 
    CSS (Cascading Style Sheet)

CSS 주석: 화면에 적용되지 않으며, 코드에 대한 설명 내용을 입력할 때 사용합니다.

(CSS에서는 /* 와 */ 사이에 주석을 작성합니다.)



CSS란?

HTML 문서의 색상이나 모양 등 겉모습을 아름답게 꾸며주는 디자인 언어입니다.

CSS로 작성된 코드를 '스타일 시트(Style Sheet)'라고 부릅니다.

CSS3의 주요 기능은 다음과 같습니다.

색상 및 배경 설정

텍스트 스타일링

폰트(글꼴) 설정

박스 모델(Box Model) 제어

시각적 포맷 및 효과 부여

리스트(목록) 스타일링

테이블(표) 꾸미기

사용자 인터페이스(UI) 디자인



구성 요소 명칭

선택자(Selector): CSS 스타일을 HTML 문서의 어떤 부분에 적용할지 가리키는 이름입니다.

속성(Property): 변경하고자 하는 스타일의 종류(이름)를 뜻하며, 약 200개 정도가 있습니다.

값(Value): 해당 속성에 구체적으로 적용할 설정값입니다.

주석문(Comment): 코드에 대한 설명을 남길 때 사용하며, CSS에서는 /* 내용 */

형태로 여러 줄 또는 한 줄 주석을 작성합니다.



CSS의 주요 특징

기본적으로 선택자와 속성 이름은 대소문자를 엄격하게 구분하지 않습니다. (단, 클래스명과 아이디명은 구분하는 것이 좋습니다.)

<head> 부분에 <style> 태그로 선언한 내용(내부 스타일 시트)은 현재 페이지 전체에

 전역적으로 적용됩니다.

반면, 태그 안에 직접 style="속성: 속성값" 형태로 선언한 것(인라인 스타일)은 오직 해당

태그에만 적용됩니다.

<link> 태그나 @import를 이용해 별도의 파일을 연결하면(외부 스타일 시트),

하나의 CSS 파일로 여러 HTML 문서에 동일한 스타일을 한 번에 적용할 수 있습니다.

<style> 태그는 한 문서 내에서 여러 번 작성할 수 있으며, 작성된 모든 내용은

 해당 페이지 전체에 적용됩니다.
    -->
</body>
</html>
