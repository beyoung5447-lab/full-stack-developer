<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        z index 속성
        개요
        절대위치 상대위치 고정위치등의 속성을 지정하면
        요소 객체들의 위치가 겹칠 때 뒤에 배치된 요소가 가려져 보이지 않게 되는 경우가 많습니다
        정의
        이때 특정 요소 객체의 우선순위를 지저하여 원하는 요소를 화면 가장 앞으로 나오게 만들어
        주는 속성이 바로 z index 속성입니다
        css
        선택자{z-index: 숫자 속성값
        속성값이 클수록 숫자가 더 위에 있는 것으로 인식되어 가장 앞에 출력 됩니다.
        } */
      img{position:absolute;}
    #spadeA{left:0px;top:20px;z-index:1;}
    #spade2{left:40px;top:30px;z-index:2;}
    #spade3{left:80px;top:40px;z-index:3;}
    #spade7{left:120px;top:50px;z-index:4;}
    /*media안에 가위 바위 보 이미지가 있다. 일단 가위 바위 보 이미지를 나열하게 하되
    겹쳐서 출력하고 가위 바위 보 순으로 우선순위를 출력 되게 하세여*/
    #scissor { left: 200px; top: 20px; z-index: 1; }
    #rock    { left: 220px; top: 30px; z-index: 2; }
    #paper   { left: 240px; top: 40px; z-index: 3; }
    </style>
</head>
<body>
    <h2>z-index 속성</h2>
    <img id="spadeA" src="./media/spade-A.png" width="100" height="140"/>
    <img id="spade2" src="./media/spade-2.png" width="100" height="140"/>
    <img id="spade3" src="./media/spade-3.png" width="100" height="140"/>
    <img id="spade7" src="./media/spade-7.png" width="100" height="140"/>

    <!-- 가위, 바위, 보 겹쳐서 출력 (우선순위: 가위(1) -> 바위(2) -> 보(3)) -->
    <img id="scissor" src="./media/가위.png" width="100" height="140"/>
    <img id="rock" src="./media/바위.png" width="100" height="140"/>
    <img id="paper" src="./media/보.png" width="100" height="140"/>

    <script>
        /* Body End JS 작성 (마지막에 실행될 스크립트) */
    </script>
</body>
</html>
