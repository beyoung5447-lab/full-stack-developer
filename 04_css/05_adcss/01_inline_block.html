<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*화면 배치 처리
웹에서 화면 배치는 구성요소를 어떻게 배치하느냐라는 문제에 적절하게 필요에 따라
화면에 배치시키는 기능을 말합니다.
CSS3를 통해 HTML 태그의 출력 위치를 지정할 수 있습니다.
HTML 문서가 작성된 순서와 무관하게 원하는 위치에 자유로운 배치가 가능합니다.
주요 배치 속성: display, position, left, right, top, bottom, float, z-index, visibility, overflow
--------------------------------------------------
박스의 유형 제어 (display 속성)
--------------------------------------------------
[1] 블록 박스 (display: block;) - 예: h1~h6, p, div
항상 새로운 라인에서 시작합니다.
가로 전체 공간을 차지하므로 옆에 다른 요소를 배치할 수 없습니다.
width(너비)와 height(높이) 크기를 조절할 수 있습니다.
padding, border, margin을 자유롭게 설정할 수 있습니다.
[2] 인라인 박스 (display: inline;) - 예: span, a, strong
새 라인에서 시작하지 않고, 텍스트처럼 흐름에 따라 배치됩니다.
옆에 다른 요소가 나란히 배치될 수 있습니다.
내용물의 크기만큼만 공간을 차지하여 width와 height 조절이 불가능합니다.
위아래 바깥 여백(margin-top, margin-bottom)은 조절할 수 없습니다.
[3] 인라인-블록 박스 (display: inline-block;)
인라인 요소처럼 새 라인에서 시작하지 않고 옆에 나란히 배치될 수 있습니다.
동시에 블록 요소처럼 width, height 크기 조절이 가능합니다.
padding, border, margin 역시 모두 자유롭게 설정할 수 있습니다.
    </style>
    <script>
        /* Head JS 작성 (미리 불러올 스크립트) */
    </script>
    <style>    
    div{width:200px;height:200px;border:1px solid green;}
    /* 원래는 block 요소였으나 inline 요소로 변경하였다.*/
    .chInline{display: inline;}

    /* traffic-light 스타일 추가 */
    .traffic-light {
        width: 100px;
        height: 100px;
        margin: 10px;
        display: inline-block;
    }
    .traffic-light.red { background-color: red; }
    .traffic-light.blue { background-color: blue; }
    .traffic-light.yellow { background-color: yellow; }
    </style>
</head>
<body>
    <!-- HTML 작성 -->
    <h2>기본 block</h2>
    <h3>줄바꿈 처리를 가지고 있다</h3>
    <div>넓이와 높이를 가지고 있다</div>
    <h2>기본 block 요소 ==> inline 요소로 css 변경</h2>
    <h3 class="chInline">inline으로 변경하여 줄이 바뀌지 않음</h3>
    <h3 class="chInline">inline으로 변경하여 줄이 바뀌지 않음</h3>
    <div class="chInline">넓이와 높이 설정이 안됨</div>
    <div class="chInline">넓이와 높이 설정이 안됨</div>

    <!-- traffic-light div 추가 -->
    <h2>Traffic Light (빨강, 파랑, 노랑)</h2>
    <div class="traffic-light red"></div>
    <div class="traffic-light blue"></div>
    <div class="traffic-light yellow"></div>

    <script>
        /* Body End JS 작성 (마지막에 실행될 스크립트) */
    </script>
</body>
</html>
