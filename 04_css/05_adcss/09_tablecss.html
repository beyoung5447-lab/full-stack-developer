    <style>
        /*
        테이블에 CSS 적용하기
테이블 속성 기본 (복습)
먼저 HTML로 표를 구성하는 기본적인 구조와 태그들을 살펴볼게요.

#주요 태그와 속성
table 태그
align : 화면에서 표 전체를 어느 쪽으로 정렬할지 지정합니다. (left, center, right)
border : 표의 테두리 두께를 설정합니다.
thead, tbody, tfoot의 하위 요소들
tr : 테이블의 행(가로줄)을 만듭니다.
td : 테이블의 열(일반적인 칸)을 만듭니다.
th : 테이블의 제목이 되는 열(칸)을 만듭니다. 일반 칸과 달리 기본적으로 굵은 글씨로 표시되며, 
가운데 정렬이 적용됩니다.
테이블에 CSS 적용하기
기본적인 HTML 표에 CSS를 입히면 훨씬 깔끔하고 예쁜 표를 만들 수 있어요. 표를 꾸밀 때 자주 사용하는 주요 
CSS 속성들은 다음과 같습니다.
1) border (테두리)
테두리의 두께, 종류, 색상을 지정합니다.
table 태그에 적용하면 표 전체의 바깥 테두리가 설정되고, th나 td에 적용하면 각각의 개별 셀 테두리가 설정됩니다.
2) border-collapse (테두리 합치기)
기본적으로 표 전체와 개별 셀에 모두 테두리를 주면 선이 두 줄(이중선)로 나타나게 됩니다.
이때 속성값을 collapse로 설정해 주면, 겹치는 테두리 선을 하나로 깔끔하게 합쳐줍니다.
3) width, height (너비와 높이)
크기를 지정하는 속성입니다.
table에 적용하면 표 전체의 너비와 높이가 되고, th나 td에 적용하면 각각 개별 셀의 크기가 조절됩니다.
4) padding (안쪽 여백)
셀 안의 글자와 테두리 사이의 간격(여백)을 설정합니다. 여백을 주면 글자가 테두리에 바짝 붙지 않아 훨씬 읽기 편해집니다.
5) text-align (글자 정렬)
셀 안의 글자를 가로 기준으로 정렬합니다.
left(왼쪽 정렬), center(가운데 정렬), right(오른쪽 정렬) 옵션을 사용할 수 있습니다*/
        table(border:1px soild green ;border-collapse:collapse;width:50%;)
        th,td(border:1px solid blue; text-align: right; width:50%;
        padding:5px;)
        /*타이틀로 회원아이디 회원명 포인트로 설정해서
        3명정도 데이터를 출력 하되 데이블에  border를 1개로 만들고
        회원아이디와 회원명을 중앙정렬 포인트를 오른쪽 정렬로 만드세요
          */
      </style>
    <table align="center"  border>
        <caption>성적표</caption>
        <col width="40%">
        <col width="60%">
        <thead>
            <tr>
                <th>과목</th><th>점수</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>국어</td><td>70</td>
            </tr>
            <tr>
                <td>영어</td><td>80</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>총계</th><td>150</td>
            </tr>
        </tfoot>
    </table>

    </script>
