<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* CSS 작성       
 
# CSS 박스 모델
**1. HTML 태그는 사각형 박스로 다루어진다.**
* 1) 각 HTML 태그 요소를 하나의 사각형 박스로 다룹니다.
* 2) 박스의 크기, 배경색, 안쪽 여백, 옆 박스와의 거리 등을 CSS로 제어할 수 있습니다.

**2. 박스 모델의 구성**
* **1) 콘텐츠(Content):** HTML 태그의 텍스트나 이미지가 실제로 출력되는 핵심 부분입니다.
* **2) 패딩(Padding, 안쪽 여백):** 콘텐츠를 **직접** 둘러싸고 있는 내부 여백입니다.
* **3) 테두리(Border):** 패딩 바깥을 감싸는 선입니다. 직선, 점선, 이중선 등으로 두께와 색상을 지정해 
      그릴 수 있습니다.
* **4) 마진(Margin, 바깥 여백):** 박스의 맨 바깥 영역이자 테두리 밖의 공간입니다. 인접한 상하좌우 이웃 
      태그(다른 박스)와의 거리를 벌려줍니다.
웹페이지에 있는 모든 글자나 이미지는 **투명한 네모난 액자(박스)** 안에 들어있다고 상상해 보세요! 
이 액자를 꾸미는 방법이 바로 'CSS 박스 모델'입니다.
* **🎁 콘텐츠 (알맹이)**
액자 안에 들어갈 '진짜 사진'이나 '그림'이에요. 우리가 웹페이지에서 보는 글자나 이미지가 바로 이것입니다.
* **☁️ 패딩 (안쪽 여백)**
사진과 액자 틀(테두리) 사이의 '빈 공간'이에요. 패딩을 넓게 주면 사진 주변에 넉넉한 여백이 생겨서 답답해 보이지 않아요.
* **🖼️ 테두리 (액자 틀)**
사진과 패딩을 감싸는 진짜 '액자의 나무틀'이에요. 두껍게 만들 수도 있고, 빨간색 점선으로 예쁘게 칠할 수도 있어요.
* **↔️ 마진 (바깥 여백)**
벽에 여러 개의 액자를 걸 때, '내 액자와 옆 액자 사이의 간격'이에요. 마진을 크게 주면 다른 액자들이 내 액자 
가까이 붙지 못하게 밀어낼 수 있어요.
결국 CSS를 다룬다는 것은 "알맹이(콘텐츠)를 얼마나 큰 틀(테두리)에 넣을지, 안쪽(패딩)과 바깥쪽(마진) 공간은 
얼마나 띄울지"를 정해주는 과정입니다.

      
        
        
        */
        div.cls01{
            
            /*border-style: solid; 테두리 라인 설정 - 종류(하나의 선)*/
            /*border-color: orange; 테두리 라인의 색상*/
            /*border-width: 50px; 테두리 선의 굵기*/
            border:solid orange 50px; /*한번에 border속성으로 종류 색상 굵기 설정*/
            background-color: yellow;
            padding: 20px; /* 내용(content)와 border 사이 간격*/
            margin:30px; /* 테두리선(border)과 외부 다른 요소와의 간격*/
            
            width:200px; /* 컨텐츠의 넓이와 높이*/
            height:200px;
            text-align: center; /*글자의 좌우 정렬 - center 중앙에 설정*/
            line-height: 200px; /*설정되어 있는 컨텐츠의 높이와 동일하게 설정함으로 세로 중앙*/
        }
        /*div02 클래스로  style은 dashed, 색상을 blue, 굵기 10px, 넓이/높이 150, 250 씩 설정*/
        div.div02{
            border: dashed blue 10px; /* 한 라인으로 보더 설정 */
            background-color: pink; /* 배경색상 핑크 */
            padding: 30px; /* 보더와 컨텐츠의 간격 30px */
            margin: 50px; /* 보더와 외부요소와의 간격 50px */
            width: 150px; /* 넓이 150px */
            height: 250px; /* 높이 250px */
            text-align: right; /* 글자 좌우 정렬 오른쪽 */
            line-height: 250px; /* 세로 중앙 정렬 (height와 동일하게 지정) */
        } /*div02 클래스로 스타일은 대쉬 색상은 블루 굵기10px 높이 150 250으로 설정
            한라인으로 보더 설정
            배경색상은 핑크
            보더와 컨텐츠의 간격 30px
            보더와 외부요소와의 간격 50px
            글자는 좌우 정렬을 오른쪽 아래 위로는 중앙에 정렬*/
    </style>
    <script>
        /* Head JS 작성 (미리 불러올 스크립트) */
    </script>
</head>
<body>
    <!-- HTML 작성 -->
    <h2>box 모델 연습</h2>
    <div class="cls01">DIV01</div>
    <div class="div02">DIV02</div>   
    <script>
        /* Body End JS 작성 (마지막에 실행될 스크립트) */
    </script>
</body>
</html>
