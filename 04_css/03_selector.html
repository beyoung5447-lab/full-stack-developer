<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 그룹 선택자 연습</title>
    <style>
      /*
        class를 통해서 하나의 태그에 여러개의 클래스(css 속성)을 적용
        여러개의 선택자를 통해서 공통된 속성을 지정
        선택자1, 선택자2, 선택자3 { 속성:속성값; }
      */

      h1 { color: navy; }
      h2 { color: blue; }
      h3 { color: orange; }

      /* h1, h2, h3 공통 배경색 지정 */
      h1, h2, h3 { 
          background-color: yellow; 
      }

      /* h2, h6, span 태그를 쉼표(,)로 묶어서 테두리 공통 적용 */
      h2, h6, span {
          border: 1px solid green;
      }/*id 속성은 화면 단위 유일하게 선언하며 사용*/
      #id01(color:red;)
    </style>
</head>
<body>
    <h1>안녕하세요</h1>
    <h6>id="id01"gut ten tag!!</h6>
    <h1>안녕하세요</h1>
    <h1>id="id01">안녕하세요</h1><!--화면에 출력이 되나 이런 경우엔
    처리 할때는 class로 선언 하고 웹 표준에서는 처리를 하지 않는 걸로 한다(id 속성으로 동일한 속성값으로 사용x javascript, jquery)-->

    <h2>반갑습니다.</h2>
    <h2>반갑습니다.</h2>
    <h2>반갑습니다.</h2>

    <h3><span>안녕</span>하세요</h3>
    <h3>안녕하세요</h3>
    <h3>안녕하세요</h3>
    <h3>안녕하세요</h3>

    <!-- 테두리 스타일(border)을 확인하기 위해 추가된 h6 및 span 태그 -->
    <h6>반갑습니다. (h6)</h6>
    <span>안녕하세요.</span>
</body>
</html>
