<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- 
텍스트(문자열)을 간단한 태그로 꾸미는 태그들의 기능
b : bold의 약자로 진하게 처리해준다.
strong : 중요하고 강조를 할 때, 주로 사용된다.
em : 위 strong과 비슷하지만 조금 보이는 것이 차이가 있다. 이것도 강조를 처리
i : 이탤릭체로 기울임 글씨체를 사용할 때, 활용한다.
del : 글자 중간에 사선을 처리해 준다.
ins : 하단에 언더바를 만들어 추가를 처리해준다.
sup : 윗 첨자를 처리해준다.
sub : 아래 첨자를 처리해준다.
mark : 하이라이팅으로 브라우저에 따라 차이가 나는데, 배경색상을 처리해서 강조해준다.-->
<h3>텍스트 꾸미기</h3>
<hr>
<p>
    <b>진하게</b><br>
    <strong>중요한</strong><br>
    <em>강조</em><br>
    <i>이탤릭으로 강조</i><br>
    <b><i>위 b태그와 i태그를 이중으로 적용</i></b><br>
    보통문자 <small>한 단계 작은 문자</small><br>
    <del>삭제</del><br>
    <ins>추가</ins><br>
    보통문자 <sup>윗 첨자</sup><br>
    보통문자 <sub>아래 첨자</sub><br>
    <mark>하이라이팅</mark>
</p>
<!--
텍스트 강조 및 하이라이트
아래의 텍스트와 조건에 맞춰 HTML 코드를 작성하세요.

출력 결과 예시 (요구 사항)
웹 개발에서는 HTML과 CSS가 기본입니다. 웹 페이지를 디자인할 때는 스타일이 중요하며, 이 문서의 주요 포인트는 하이라이트된 부분입니다.

작성 조건
HTML은 굵게(진하게) 처리합니다.

CSS는 이탤릭체(기울임)로 강조합니다.

스타일은 하이라이팅 처리합니다.

주요 포인트는 하이라이팅과 강조(이탤릭체 등)를 동시에 적용합니다.

-->
<p>
    웹 개발에서는 <strong>HTML</strong>과 <em>CSS</em>가 기본입니다. 웹 페이지를 디자인할 때는 <mark>스타일</mark>이 중요하며, 이 문서의 <em><mark>주요 포인트</mark></em>는 하이라이트된 부분입니다.
</p>

</body>
</html>
